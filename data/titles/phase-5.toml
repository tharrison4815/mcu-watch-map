# Titles in Phase 5, in release order (the build checks the order).
# Field guide and the spoiler rules every entry must follow: see CONTRIBUTING.md.
#
#   id           short unique id, used by links (never change an existing one)
#   title        full title; series are one entry per season, e.g. "Loki (Season 1)"
#   map_lines    the title split into 1 to 3 short lines for its box on the map
#   type         film, show, special or shorts
#   released     release date (first episode for a series)
#   runtime      minutes (films and specials) / episodes: count (series and shorts)
#   animated     true for animated titles (hidden unless "Animated" is ticked)
#   row          franchise row, a name from rows.toml
#   story_order  position in story order; only the order matters, so pick an
#                unused number between the neighbours
#   story_year   in-story year shown on the map (always visible, so no spoilers)
#   synopsis     premise only: no twists, and nothing about how earlier titles end
#   cast         { name, role, hero, twist }: name is the character's stable id across
#                titles; role is Lead, Main, Supporting, Cameo or Post-credits; hero is the
#                hero name in this title (leave it out if it would spoil anything);
#                twist = true hides the appearance behind a second spoiler flap
#   upcoming     true for announced titles that aren't out: only id, title, map_lines,
#                type, released (with month_only = true if only the month is known),
#                animated and row. No other details.

