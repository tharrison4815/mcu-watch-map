name: Something isn't working
description: A bug in the page itself, such as a button that does nothing or a layout problem.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: e.g. Firefox on Windows, Safari on iPhone
